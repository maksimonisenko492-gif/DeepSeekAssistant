name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Make gradlew executable
      run: chmod +x ./gradlew
    - name: Build APK
      run: ./gradlew
    - uses: actions/upload-artifact@v4
      with:
        name: DeepSeekAssistant-APK
        path: app/build/outputs/apk/debug/app-debug.apk
