name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Build APK
      run: |
        mkdir -p app/src/main/java/com/example/deepseekassistant
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values
        
        # Create build.gradle files
        cat > build.gradle << 'EOF'
        plugins {
            id 'com.android.application' version '8.1.0' apply false
        }
        task clean(type: Delete) {
            delete rootProject.buildDir
        }
        EOF
        
        cat > settings.gradle << 'EOF'
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "DeepSeekAssistant"
        include ':app'
        EOF
        
        cat > app/build.gradle << 'EOF'
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.example.deepseekassistant'
            compileSdk 34
            defaultConfig {
                applicationId "com.example.deepseekassistant"
                minSdk 21
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            buildTypes {
                release {
                    minifyEnabled false
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                }
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.10.0'
        }
        EOF
        
        # Create AndroidManifest.xml
        cat > app/src/main/AndroidManifest.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.example.deepseekassistant">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:label="DeepSeek Assistant"
                android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
        
        # Create MainActivity.java
        cat > app/src/main/java/com/example/deepseekassistant/MainActivity.java << 'EOF'
        package com.example.deepseekassistant;
        import android.os.Bundle;
        import android.widget.Button;
        import androidx.appcompat.app.AppCompatActivity;

        public class MainActivity extends AppCompatActivity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);
                
                Button btn = findViewById(R.id.test_btn);
                btn.setOnClickListener(v -> {
                    btn.setText("Работает! 🚀");
                });
            }
        }
        EOF
        
        # Create activity_main.xml
        cat > app/src/main/res/layout/activity_main.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:padding="16dp"
            android:background="#1a1a1a">

            <TextView
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:text="🤖 DeepSeek Assistant"
                android:textColor="#ffffff"
                android:textSize="24sp"
                android:gravity="center"
                android:layout_marginBottom="30dp" />

            <Button
                android:id="@+id/test_btn"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:text="🎯 Нажми меня!"
                android:textColor="#ffffff"
                android:background="#667eea"
                android:textSize="18sp" />

            <TextView
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:text="✅ APK готов к сборке!"
                android:textColor="#4CAF50"
                android:textSize="16sp"
                android:gravity="center"
                android:layout_marginTop="20dp" />

        </LinearLayout>
        EOF
        
        # Create strings.xml
        mkdir -p app/src/main/res/values
        cat > app/src/main/res/values/strings.xml << 'EOF'
        <resources>
            <string name="app_name">DeepSeek Assistant</string>
        </resources>
        EOF
        
        ./gradlew assembleDebug
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: DeepSeekAssistant-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 90
